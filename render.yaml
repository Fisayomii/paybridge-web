# Render Blueprint for the frontend (optional: you can also click through the dashboard).
services:
  - type: web
    name: paybridge-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false # you type the backend URL in the dashboard
    routes:
      # Single-page app: every path serves index.html and React Router takes over.
      - type: rewrite
        source: /*
        destination: /index.html
